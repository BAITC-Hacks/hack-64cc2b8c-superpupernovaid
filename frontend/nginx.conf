# Docker may change the backend IP when recreating its container.
upstream meeting_backend {
    zone meeting_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 5 GiB media limit + 1 MiB multipart overhead; align with MEDIA_MAX_FILE_SIZE_BYTES.
    client_max_body_size 5121m;
    client_body_timeout 300s;
    location /api/ {
        proxy_request_buffering off;
        proxy_http_version 1.1;
        # Must exceed AUDIO_FFMPEG_TIMEOUT_SECONDS plus inspection/storage overhead.
        proxy_read_timeout 1000s;
        proxy_pass http://meeting_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
