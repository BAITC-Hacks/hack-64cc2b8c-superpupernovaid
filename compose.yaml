name: superpupernova

include:
  - compose.infra.yaml

x-backend: &backend
  image: superpupernova-backend:local
  build:
    context: ./backend
    target: production
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
    REDIS_URL: redis://redis:6379/0
    AI_MODE: ${AI_MODE:-mock}
    S3_ENDPOINT_URL: http://minio:9000
    SMTP_HOST: mailpit
    MEDIA_UPLOAD_DIR: /data/media
  init: true
  volumes: ["media-data:/data/media"]

services:
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *backend
    # One Uvicorn process: admission limits live in that process.
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
  worker:
    <<: *backend
    command: ["celery", "-A", "app.infrastructure.queue:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  reminders:
    <<: *backend
    profiles: ["reminders"]
    command: ["celery", "-A", "app.infrastructure.queue:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/reminders-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  media-data:
