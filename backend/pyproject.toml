[project]
name = "superpupernova-backend"
version = "0.1.0"
description = "Modular monolith with FastAPI and OpenAI Agents SDK"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "celery[redis]>=5.5,<6", "openai-agents>=0.2,<1",
  "boto3>=1.37,<2", "python-multipart>=0.0.20,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs a real ffprobe/ffmpeg installation"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
